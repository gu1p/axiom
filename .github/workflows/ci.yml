name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run repository checks
        run: make fmt-check lint test installer-check
      - name: Enforce repository policy with Axiom
        if: ${{ always() }}
        run: make policy-check
