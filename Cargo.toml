[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Executable architecture and code-quality policy for Rust workspaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gu1p/axiom"
readme = "README.md"
keywords = ["architecture", "clippy", "lint", "policy", "rust"]
categories = ["development-tools"]

[workspace.dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
cargo_metadata = "0.23"
cargo-platform = "0.3"
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
insta = { version = "1.43", default-features = false }
ra_ap_syntax = "=0.0.331"
rustc-hash = "2.1"
rustix = "1.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
